<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Módulos de atuação técnica</title>
  <desc id="desc">Três módulos mostram integrações corporativas, observabilidade e relatórios e dados, com um quarto módulo para tecnologias em evolução.</desc>
  <rect width="1000" height="330" rx="18" fill="#071018"/>
  <rect x="1" y="1" width="998" height="328" rx="17" fill="none" stroke="#1d5d7d"/>
  <text x="46" y="50" fill="#58d4f7" font-family="Consolas, monospace" font-size="15" letter-spacing="1.5">MÓDULOS DE ATUAÇÃO // INTEGRAÇÕES QUE GERAM VALOR</text>
  <g transform="translate(42 79)">
    <g>
      <rect width="216" height="204" rx="10" fill="#0a1922" stroke="#1d627f"/>
      <path d="M24 43h34m-17-17v34M158 43h34m-17-17v34M42 130h132" stroke="#36c5f0" stroke-width="2"/>
      <circle cx="42" cy="130" r="7" fill="#36c5f0"/><circle cx="108" cy="130" r="7" fill="#50d47c"/><circle cx="174" cy="130" r="7" fill="#f59b42"/>
      <text x="24" y="92" fill="#edf7fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Integrações corporativas</text>
      <text x="24" y="162" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">ERPs • CRMs • APIs • Webhooks</text>
      <text x="24" y="184" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">JSON/XML • SFTP • regras de negócio</text>
    </g>
    <g transform="translate(232 0)">
      <rect width="216" height="204" rx="10" fill="#0a1922" stroke="#1d627f"/>
      <path d="M29 121v-25m30 25V70m30 51V88m30 33V48m30 73V76" stroke="#50d47c" stroke-width="8"/>
      <path d="M20 142h174" stroke="#2f8d56" stroke-width="2"/>
      <text x="24" y="42" fill="#edf7fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Observabilidade</text>
      <text x="24" y="170" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">CloudWatch • Dynatrace • logs</text>
      <text x="24" y="192" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">diagnóstico e troubleshooting</text>
    </g>
    <g transform="translate(464 0)">
      <rect width="216" height="204" rx="10" fill="#0a1922" stroke="#1d627f"/>
      <path d="M34 50h70l25 25v76H34z" fill="none" stroke="#f59b42" stroke-width="2"/>
      <path d="M104 50v25h25M54 105h55M54 128h55M54 151h32" stroke="#f59b42" stroke-width="2"/>
      <text x="24" y="42" fill="#edf7fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Relatórios e dados</text>
      <text x="24" y="180" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">SQL/MySQL • Views • JasperReports</text>
      <text x="24" y="202" fill="#a7c2cf" font-family="Segoe UI, Arial, sans-serif" font-size="14">JRXML • consultas • estruturas</text>
    </g>
    <g transform="translate(696 0)">
      <rect width="216" height="204" rx="10" fill="#0a1922" stroke="#654b96"/>
      <circle cx="108" cy="103" r="54" fill="none" stroke="#9b6cff" stroke-width="2"/>
      <path d="M66 103h84M108 61v84M77 72l62 62M77 134l62-62" stroke="#9b6cff" stroke-width="1" opacity="0.8"/>
      <text x="24" y="42" fill="#edf7fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Em evolução</text>
      <text x="24" y="180" fill="#c5acef" font-family="Segoe UI, Arial, sans-serif" font-size="14">Python • FastAPI • PostgreSQL</text>
      <text x="24" y="202" fill="#c5acef" font-family="Segoe UI, Arial, sans-serif" font-size="14">Docker • backend dedicado</text>
    </g>
