<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Projetos e experiência técnica</title>
  <desc id="desc">Animação alternando projetos públicos, backend, integrações, dados, JasperReports, observabilidade e atividade privada anonimizada.</desc>

  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .title { fill: #f0f6fc; font: 700 26px 'Segoe UI', Ubuntu, sans-serif; }
    .subtitle { fill: #8b949e; font: 400 15px 'Segoe UI', Ubuntu, sans-serif; }
    .label-public { fill: #3fb950; font: 700 14px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .label-tech { fill: #58a6ff; font: 700 14px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .label-data { fill: #f0883e; font: 700 14px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .label-observability { fill: #39c5cf; font: 700 14px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .label-private { fill: #a371f7; font: 700 14px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; }
    .project { fill: #f0f6fc; font: 700 25px 'Segoe UI', Ubuntu, sans-serif; }
    .meta { fill: #8b949e; font: 400 15px 'Segoe UI', Ubuntu, sans-serif; }
    .strong { fill: #c9d1d9; font: 600 16px 'Segoe UI', Ubuntu, sans-serif; }
    .cursor { fill: #58a6ff; }
    .line { stroke: #21262d; stroke-width: 1; }
    .dot { fill: #30363d; }
    .dot-active { fill: #58a6ff; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #d0d7de; }
      .title, .project, .strong { fill: #1f2328; }
      .subtitle, .meta { fill: #656d76; }
      .line { stroke: #d8dee4; }
      .dot { fill: #d0d7de; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="998" height="348" rx="18"/>

  <text class="title" x="42" y="52">Project &amp; Engineering Stream</text>
  <text class="subtitle" x="42" y="80">projetos públicos + experiência técnica + atividade privada preservada</text>
  <line class="line" x1="42" y1="104" x2="958" y2="104"/>

  <!-- 1 -->
  <g opacity="0">
    <text class="label-public" x="42" y="145">PUBLIC PROJECT</text>
    <text class="project" x="42" y="183">IntegrationCSV_TXT</text>
    <text class="meta" x="42" y="213">processamento e integração de arquivos estruturados</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.14;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 2 -->
  <g opacity="0">
    <text class="label-public" x="42" y="145">PUBLIC PROJECT</text>
    <text class="project" x="42" y="183">Gestao_Viagem</text>
    <text class="meta" x="42" y="213">projeto público disponível no perfil</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.24;0.26;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 3 -->
  <g opacity="0">
    <text class="label-public" x="42" y="145">PUBLIC PROJECT</text>
    <text class="project" x="42" y="183">Book_Control</text>
    <text class="meta" x="42" y="213">projeto público disponível no perfil</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.36;0.38;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 4 -->
  <g opacity="0">
    <text class="label-tech" x="42" y="145">BACKEND &amp; INTEGRATIONS</text>
    <text class="project" x="42" y="183">Node.js • AWS Lambda • REST • SOAP</text>
    <text class="meta" x="42" y="213">APIs • JSON/XML • Webhooks • SFTP • integrações entre sistemas</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.50;0.52;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 5 -->
  <g opacity="0">
    <text class="label-data" x="42" y="145">DATA &amp; REPORTING</text>
    <text class="project" x="42" y="183">SQL • MySQL • Views • JasperReports</text>
    <text class="meta" x="42" y="213">JRXML • parâmetros • expressões • consultas • estruturas de dados</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.64;0.66;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 6 -->
  <g opacity="0">
    <text class="label-observability" x="42" y="145">OBSERVABILITY &amp; TROUBLESHOOTING</text>
    <text class="project" x="42" y="183">AWS CloudWatch • Dynatrace</text>
    <text class="meta" x="42" y="213">logs • incidentes • produção • conectividade • diagnóstico ponta a ponta</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.78;0.80;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 7 -->
  <g opacity="0">
    <text class="label-public" x="42" y="145">MORE PUBLIC PROJECTS</text>
    <text class="project" x="42" y="183">park-ease • Banana_MQTT • SocialMedia</text>
    <text class="meta" x="42" y="213">outros projetos públicos disponíveis no perfil</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.80;0.88;0.90;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- 8 -->
  <g opacity="0">
    <text class="label-private" x="42" y="145">PRIVATE PROJECTS</text>
    <text class="project" x="42" y="183">Atividade privada preservada</text>
    <text class="meta" x="42" y="213">contribuições agregadas sem exposição de nomes, URLs ou conteúdo</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.88;0.90;0.98;1" dur="28s" repeatCount="indefinite"/>
  </g>

  <line class="line" x1="42" y1="252" x2="958" y2="252"/>

  <text class="strong" x="42" y="289">Node.js</text>
  <text class="meta" x="113" y="289">•</text>
  <text class="strong" x="132" y="289">AWS Lambda</text>
  <text class="meta" x="236" y="289">•</text>
  <text class="strong" x="255" y="289">APIs</text>
  <text class="meta" x="296" y="289">•</text>
  <text class="strong" x="315" y="289">SQL</text>
  <text class="meta" x="348" y="289">•</text>
  <text class="strong" x="367" y="289">JasperReports</text>
  <text class="meta" x="480" y="289">•</text>
  <text class="strong" x="499" y="289">JRXML</text>
  <text class="meta" x="554" y="289">•</text>
  <text class="strong" x="573" y="289">CloudWatch</text>
  <text class="meta" x="668" y="289">•</text>
  <text class="strong" x="687" y="289">Dynatrace</text>

  <text class="meta" x="42" y="320">Integrações • Dados • Relatórios • Observabilidade • Troubleshooting • Especificação Técnica</text>

  <rect class="cursor" x="935" y="304" width="9" height="18">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
